[workspace]
resolver = "3"
members = [
    "crates/appd-cli",
    "crates/appd-runtime",
    "crates/appd-target-pack",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
version = "0.1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
anyhow = "1.0.102"
assert_cmd = "2.2.2"
base64 = "0.22.1"
block2 = "0.6.2"
capnp = "0.25.5"
clap = { version = "4.6.1", features = ["derive"] }
dispatch2 = "0.3.1"
jni = "0.22.4"
jsonc-parser = "0.32.4"
libc = "0.2.186"
mime_guess = "2.0.5"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-security = "0.3.2"
objc2-ui-kit = "0.3.2"
objc2-web-kit = "0.3.2"
openssl = { version = "0.10.80", features = ["vendored"] }
p12-keystore = { package = "isideload-p12-keystore", version = "0.3.0-rc4", default-features = false }
predicates = "3.1.3"
rcgen = "0.14.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
time = "0.3.47"
toml = "1.1.2"
walkdir = "2.5.0"
webview2-com = "0.39.1"
webkit6 = "0.6.1"
windows = "0.62"
x509-parser = "0.18.1"
