[workspace]
resolver = "3"
members = [
    "crates/appd-bare",
    "crates/appd-bundle",
    "crates/appd-cli",
    "crates/appd-runtime",
    "crates/appd-shell-android",
    "crates/appd-shell-apple",
    "crates/appd-target-pack",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.96"
version = "0.1.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "z"
panic = "abort"
strip = "symbols"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "deny"
too_many_lines = "deny"
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
anyhow = "1.0.102"
assert_cmd = "2.2.2"
block2 = "0.6.2"
clap = { version = "4.6.1", features = ["derive"] }
dispatch2 = "0.3.1"
jsonc-parser = "0.32.4"
mime_guess = "2.0.5"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-foundation = "0.3.2"
objc2-security = "0.3.2"
objc2-ui-kit = "0.3.2"
objc2-web-kit = "0.3.2"
jni = "0.21.1"
libc = "0.2.186"
p256 = { version = "0.13.2", features = ["pkcs8"] }
predicates = "3.1.3"
rcgen = "0.14.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.18"
time = "0.3.47"
tao = { version = "0.35.3", default-features = false, features = ["rwh_06"] }
toml = "1.1.2"
walkdir = "2.5.0"
wry = { version = "0.55.1", default-features = false }
x509-parser = { version = "0.18.1", features = ["verify"] }
