[package]
name = "appd-runtime"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
native-shell = [
    "dep:block2",
    "dep:dispatch2",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-core-foundation",
    "dep:objc2-foundation",
    "dep:objc2-security",
    "dep:p256",
    "dep:objc2-ui-kit",
    "dep:objc2-web-kit",
]
bare-runtime = ["native-shell", "dep:appd-bare", "appd-bare/native"]
bare-test-stubs = ["bare-runtime", "appd-bare/test-stubs"]

[[bin]]
name = "appd-runtime"
path = "src/main.rs"
test = false

[dependencies]
appd-bare = { path = "../appd-bare", optional = true }
jsonc-parser = { workspace = true, features = ["serde"] }
mime_guess.workspace = true
rcgen = { workspace = true, features = ["pem", "x509-parser"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true
walkdir.workspace = true
x509-parser.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { workspace = true, optional = true }
dispatch2 = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true }
objc2-core-foundation = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
objc2-security = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
objc2-web-kit = { workspace = true, optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = { workspace = true, optional = true }
dispatch2 = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-core-foundation = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
objc2-security = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
objc2-ui-kit = { workspace = true, features = [
    "UIApplication",
    "UIResponder",
    "UIScreen",
    "UIView",
    "UIViewController",
    "UIWindow",
    "objc2-core-foundation",
], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true
tao.workspace = true
wry.workspace = true

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
serde_json.workspace = true

[lints]
workspace = true
