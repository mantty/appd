name: appd target packs weekly

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options:
          - all
          - macos-arm64
          - macos-x64
          - ios-arm64
          - ios-simulator-arm64
          - ios-simulator-x64
          - android-arm64
          - windows-x64
        default: all
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: appd-target-packs-weekly-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22"

jobs:
  build-sdk:
    name: build ${{ matrix.target }}
    if: github.event_name == 'schedule' || inputs.platform != 'windows-x64'
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((github.event_name == 'schedule' || inputs.platform == 'all') && '["macos-arm64", "macos-x64", "ios-arm64", "ios-simulator-arm64", "ios-simulator-x64", "android-arm64"]' || format('["{0}"]', inputs.platform)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Android SDK
        if: matrix.target == 'android-arm64'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android NDK
        if: matrix.target == 'android-arm64'
        run: sdkmanager "ndk;29.0.14206865"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,x86_64-apple-darwin,aarch64-linux-android

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.9.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build target pack
        run: |
          set -euo pipefail
          cargo run -p xtask -- target-pack --target "${{ matrix.target }}"

      - name: Verify packaged Worker mTLS
        if: matrix.target == 'macos-arm64'
        run: cargo test -p appd --features native --test packaged_worker

      - name: Archive target pack
        run: |
          set -euo pipefail
          tar -czf "appd-target-pack-${{ matrix.target }}.tar.gz" \
            -C "target/appd-target-packs/${{ matrix.target }}" .

      - name: Upload target pack artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: appd-target-pack-${{ matrix.target }}
          path: appd-target-pack-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-windows-sdk:
    name: build windows-x64
    if: github.event_name == 'schedule' || inputs.platform == 'all' || inputs.platform == 'windows-x64'
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Check native build tools
        run: |
          cmake --version
          nasm -v
          perl --version

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.9.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build target pack
        run: |
          cargo run -p xtask -- target-pack --target windows-x64

      - name: Archive target pack
        run: tar -czf appd-target-pack-windows-x64.tar.gz -C target/appd-target-packs/windows-x64 .

      - name: Upload target pack artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: appd-target-pack-windows-x64
          path: appd-target-pack-windows-x64.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: create release
    if: github.event_name == 'schedule' || inputs.platform == 'all'
    needs: [build-sdk, build-windows-sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Download target pack artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: appd-target-pack-*
          path: artifacts
          merge-multiple: true

      - name: Compute release metadata
        id: meta
        run: |
          set -euo pipefail
          echo "tag=appd.target-pack.${{ github.run_number }}" >> "${GITHUB_OUTPUT}"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          gh release delete "${tag}" --yes --cleanup-tag || true
          gh release create "${tag}" artifacts/*.tar.gz \
            --title "${tag}" \
            --notes "Source-built appd QuickJS target packs for the supported native platforms."
