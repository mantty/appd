name: appd CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: appd-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,x86_64-apple-darwin,aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          ndk="${ANDROID_HOME}/ndk/29.0.14206865"
          toolchain="$(find "${ndk}/toolchains/llvm/prebuilt" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          {
            echo "CC_aarch64_linux_android=${toolchain}/bin/aarch64-linux-android31-clang"
            echo "AR_aarch64_linux_android=${toolchain}/bin/llvm-ar"
            echo "RANLIB_aarch64_linux_android=${toolchain}/bin/llvm-ranlib"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--target=aarch64-linux-android31 --sysroot=${toolchain}/sysroot"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${toolchain}/bin/aarch64-linux-android31-clang"
          } >> "${GITHUB_ENV}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.9.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: |
          pnpm lint:ts
          pnpm test:ts

      - name: Check native shells
        run: xcrun swift-format lint --strict platforms/apple/native/*.swift plugins/*/apple/*.swift

      - name: Build host target pack
        run: |
          case "$(uname -m)" in
            arm64) target=macos-arm64 ;;
            x86_64) target=macos-x64 ;;
            *) echo "unsupported runner architecture" >&2; exit 1 ;;
          esac
          cargo run -p xtask -- target-pack --target "${target}"

      - name: Check Rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p appd --all-targets --features test-stubs -- -D warnings
          cargo clippy -p appd --lib --target aarch64-apple-ios --features test-stubs -- -D warnings
          cargo clippy -p appd --lib --target aarch64-apple-ios-sim --features test-stubs -- -D warnings
          cargo clippy -p appd --lib --target x86_64-apple-ios --features test-stubs -- -D warnings
          cargo clippy -p appd --lib --target x86_64-apple-darwin --features test-stubs -- -D warnings
          cargo clippy -p appd --lib --target aarch64-linux-android --features test-stubs -- -D warnings
          cargo test -p appd --features native
          cargo test --workspace

  check-windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Check native build tools
        shell: pwsh
        run: |
          cmake --version
          nasm -v
          perl --version

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.9.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: |
          pnpm lint:ts
          pnpm test:ts

      - name: Build Windows target pack
        run: cargo run -p xtask -- target-pack --target windows-x64

      - name: Check Rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
