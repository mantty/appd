name: appd workerd weekly

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: appd-workerd-weekly-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  BAZEL_REMOTE_VERSION: "v2.6.1"
  GO_VERSION: "1.24.2"
  PYTHON_VERSION: "3.13"
  PYTHONUNBUFFERED: "1"
  TERRAFORM_VERSION: "1.15.6"

jobs:
  validate:
    name: validate tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Validate workerd tooling
        run: |
          set -euxo pipefail
          python3 -m py_compile workerd/scripts/*.py
          python3 -m unittest discover -s workerd/tests -v

      - name: Validate R2 cache Terraform
        working-directory: infra/cloudflare/r2-cache
        run: |
          set -euxo pipefail
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

      - name: Fetch and patch pinned upstream
        run: |
          set -euxo pipefail
          source_dir="$(python3 workerd/scripts/fetch-upstream.py)"
          python3 workerd/scripts/apply-overlay.py --source "${source_dir}"

  build-sdk:
    name: build ${{ matrix.target }}
    needs: validate
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Install bazel-remote
        run: |
          set -euxo pipefail
          go install "github.com/buchgr/bazel-remote/v2@${BAZEL_REMOTE_VERSION}"
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"

      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld libc++-dev libc++abi-dev

      - name: Cache pinned upstream downloads
        uses: actions/cache@v5.0.5
        with:
          path: target/workerd/downloads
          key: appd-workerd-downloads-${{ hashFiles('workerd/upstream.toml') }}

      - name: Cache Bazel repository downloads
        uses: actions/cache@v5.0.5
        with:
          path: target/workerd/cache/bazel-repository
          key: appd-workerd-repository-${{ runner.os }}-${{ hashFiles('workerd/upstream.toml') }}
          restore-keys: |
            appd-workerd-repository-${{ runner.os }}-

      - name: Build SDK
        env:
          APPD_R2_ACCOUNT_ID: ${{ secrets.APPD_R2_ACCOUNT_ID }}
          APPD_R2_ACCESS_KEY_ID: ${{ secrets.APPD_R2_ACCESS_KEY_ID }}
          APPD_R2_BUCKET: ${{ secrets.APPD_R2_BUCKET }}
          APPD_R2_PREFIX: ${{ vars.APPD_R2_PREFIX }}
          APPD_R2_SECRET_ACCESS_KEY: ${{ secrets.APPD_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euxo pipefail
          python3 workerd/scripts/build-sdk.py \
            --target "${{ matrix.target }}" \
            --output "target/workerd/sdk/${{ matrix.target }}" \
            --cache r2-read-write \
            --bazel-remote-max-size-gib 8 \
            -- --verbose_failures

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: appd-workerd-sdk-${{ matrix.target }}
          path: target/workerd/sdk/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  # Mobile workerd SDKs are intentionally not in this weekly matrix yet.
  # The pinned upstream workerd release does not currently expose appd's old
  # Android or iOS Bazel platform configs. Add android-arm64, ios-arm64, and
  # ios-simulator-arm64 here once those configs live in appd/workerd patches.
