name: appd workerd weekly

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options:
          - macos
        default: macos
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: appd-workerd-weekly-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GO_VERSION: "1.24.2"
  PYTHON_VERSION: "3.13"
  PYTHONUNBUFFERED: "1"

jobs:
  build-sdk:
    name: build ${{ matrix.target }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Cache pinned upstream downloads
        uses: actions/cache@v5.0.5
        with:
          path: target/workerd/downloads
          key: appd-workerd-downloads-${{ hashFiles('workerd/upstream.toml') }}

      - name: Cache Bazel repository downloads
        uses: actions/cache@v5.0.5
        with:
          path: target/workerd/cache/bazel-repository
          key: appd-workerd-repository-${{ runner.os }}-${{ hashFiles('workerd/upstream.toml') }}
          restore-keys: |
            appd-workerd-repository-${{ runner.os }}-

      - name: Build SDK
        env:
          # bazel-remote itself is installed by build-sdk.py (go install, same
          # code path used locally) -- no separate install step here, so this
          # runner exercises the identical flow a developer's machine does.
          APPD_BAZEL_S3_ACCESS_KEY_ID: ${{ vars.APPD_BAZEL_CACHE_ACCESS_KEY_ID }}
          APPD_BAZEL_S3_SECRET_ACCESS_KEY: ${{ secrets.APPD_BAZEL_CACHE_SECRET_ACCESS_KEY }}
        run: |
          set -euxo pipefail
          python3 workerd/scripts/build-sdk.py \
            --target "${{ matrix.target }}" \
            --output "target/workerd/sdk/${{ matrix.target }}" \
            --bazel-remote-max-size-gib 8 \
            -- --verbose_failures

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: appd-workerd-sdk-${{ matrix.target }}
          path: target/workerd/sdk/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14

  # Only macOS arm64 is built for now. Linux, Windows, macOS Intel, and
  # mobile (Android/iOS) targets are intentionally not in this weekly matrix
  # yet -- the pinned upstream workerd release doesn't currently expose
  # appd's old mobile Bazel platform configs, and the other desktop targets
  # haven't been validated against this cache setup. Add a matrix entry and
  # a matching `workflow_dispatch.inputs.platform.options` value once each
  # is ready.
