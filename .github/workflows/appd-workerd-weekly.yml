name: appd workerd weekly

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options:
          - all
          - macos
          - ios-simulator-arm64
          - ios-simulator-x64
        default: all
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: appd-workerd-weekly-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GO_VERSION: "1.24.2"
  PYTHON_VERSION: "3.13"
  PYTHONUNBUFFERED: "1"

jobs:
  build-sdk:
    name: build ${{ matrix.target }}
    if: github.event_name == 'schedule' || inputs.platform == 'all' || inputs.platform == matrix.platform
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Linux, Windows, macOS Intel, iOS device, and Android are not in this
      # matrix yet. Add an entry here and a matching
      # `workflow_dispatch.inputs.platform.options` value once each is ready.
      matrix:
        include:
          - target: aarch64-apple-darwin
            platform: macos
            runner: macos-15
          - target: aarch64-apple-ios-sim
            platform: ios-simulator-arm64
            runner: macos-15
          - target: x86_64-apple-ios
            platform: ios-simulator-x64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Cache pinned upstream downloads
        uses: actions/cache@v5.0.5
        with:
          path: target/workerd/downloads
          key: appd-workerd-downloads-${{ hashFiles('workerd/upstream.toml') }}

      - name: Cache Bazel repository downloads
        uses: actions/cache@v5.0.5
        with:
          path: target/workerd/cache/bazel-repository
          key: appd-workerd-repository-${{ runner.os }}-${{ hashFiles('workerd/upstream.toml') }}
          restore-keys: |
            appd-workerd-repository-${{ runner.os }}-

      - name: Build SDK
        env:
          # bazel-remote itself is installed by build-sdk.py (go install, same
          # code path used locally) -- no separate install step here, so this
          # runner exercises the identical flow a developer's machine does.
          APPD_BAZEL_S3_ACCESS_KEY_ID: ${{ vars.APPD_BAZEL_CACHE_ACCESS_KEY_ID }}
          APPD_BAZEL_S3_SECRET_ACCESS_KEY: ${{ secrets.APPD_BAZEL_CACHE_SECRET_ACCESS_KEY }}
        run: |
          set -euxo pipefail
          # --jobs=32 despite this runner having 3 cores: most actions here
          # are remote-cache hits, which are I/O-bound (waiting on R2), not
          # CPU-bound -- Bazel's auto-detected default caps concurrency to
          # core count, serializing thousands of cache checks that don't
          # actually need a free CPU to proceed.
          python3 workerd/scripts/build-sdk.py \
            --target "${{ matrix.target }}" \
            --output "target/workerd/sdk/${{ matrix.target }}" \
            --bazel-remote-max-size-gib 8 \
            -- --verbose_failures --jobs=32

      - name: Archive SDK
        run: |
          set -euxo pipefail
          tar -czf "appd-workerd-sdk-${{ matrix.target }}.tar.gz" \
            -C "target/workerd/sdk/${{ matrix.target }}" .

      # This artifact only hands the archive off to the release job below --
      # it isn't the release itself. Short retention on purpose.
      - name: Upload SDK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: appd-workerd-sdk-${{ matrix.target }}
          path: appd-workerd-sdk-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: create release
    # Partial platform builds don't publish; a release always carries the
    # full platform set.
    if: github.event_name == 'schedule' || inputs.platform == 'all'
    needs: build-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download SDK artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: appd-workerd-sdk-*
          path: artifacts
          merge-multiple: true

      - name: Compute release metadata
        id: meta
        run: |
          set -euxo pipefail
          upstream_json="$(python3 -c "
          import json, sys
          sys.path.insert(0, 'workerd/scripts')
          import appd_workerd
          print(json.dumps(appd_workerd.load_upstream_config()))
          ")"
          upstream_tag="$(echo "${upstream_json}" | jq -r .tag)"
          upstream_commit="$(echo "${upstream_json}" | jq -r .commit)"
          echo "tag=appd.workerd-${upstream_tag}.${{ github.run_number }}" >> "${GITHUB_OUTPUT}"
          echo "upstream_tag=${upstream_tag}" >> "${GITHUB_OUTPUT}"
          echo "upstream_commit=${upstream_commit}" >> "${GITHUB_OUTPUT}"

      # Idempotent: a re-run of a partially failed workflow reuses the same
      # run_number, and so the same tag -- delete any prior attempt's release
      # (and its tag) before recreating, rather than failing on "exists".
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          gh release delete "${tag}" --yes --cleanup-tag || true
          gh release create "${tag}" artifacts/*.tar.gz \
            --title "${tag}" \
            --notes "Built from cloudflare/workerd ${{ steps.meta.outputs.upstream_tag }} (${{ steps.meta.outputs.upstream_commit }})."
