name: appd Bare weekly

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options:
          - all
          - macos-arm64
          - macos-x64
          - ios-arm64
          - ios-simulator-arm64
          - ios-simulator-x64
          - android-arm64
        default: all
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: appd-bare-weekly-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.13"
  SCCACHE_VERSION: "0.15.0"
  SCCACHE_BUCKET: appd-workerd-bazel-cache
  SCCACHE_ENDPOINT: https://dacf3ead71e534fdef9555c28d81774c.r2.cloudflarestorage.com
  SCCACHE_REGION: auto
  SCCACHE_S3_KEY_PREFIX: bare/sccache/v1
  SCCACHE_S3_USE_SSL: "true"

jobs:
  build-sdk:
    name: build ${{ matrix.target }}
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((github.event_name == 'schedule' || inputs.platform == 'all') && '["macos-arm64", "macos-x64", "ios-arm64", "ios-simulator-arm64", "ios-simulator-x64", "android-arm64"]' || format('["{0}"]', inputs.platform)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Android SDK
        if: matrix.target == 'android-arm64'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android NDK
        if: matrix.target == 'android-arm64'
        run: sdkmanager "ndk;29.0.14206865"

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.9.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache upstream sources and prebuilds
        uses: actions/cache@v5.0.5
        with:
          path: |
            target/bare/downloads
            target/bare/build/${{ matrix.target }}/_deps
          key: appd-bare-deps-${{ matrix.target }}-${{ hashFiles('bare/upstream.toml', 'pnpm-lock.yaml') }}

      - name: Install sccache
        run: |
          set -euo pipefail
          machine="$(uname -m)"
          case "${machine}" in
            arm64) triple="aarch64-apple-darwin" ;;
            x86_64) triple="x86_64-apple-darwin" ;;
            *) echo "unsupported runner architecture: ${machine}" >&2; exit 1 ;;
          esac
          archive="sccache-v${SCCACHE_VERSION}-${triple}.tar.gz"
          curl -fsSLO "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/${archive}"
          curl -fsSLO "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/${archive}.sha256"
          expected="$(cat "${archive}.sha256")"
          actual="$(shasum -a 256 "${archive}" | cut -d ' ' -f 1)"
          test "${actual}" = "${expected}"
          tar -xzf "${archive}"
          echo "${PWD}/sccache-v${SCCACHE_VERSION}-${triple}" >> "${GITHUB_PATH}"

      - name: Build SDK
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.APPD_BAZEL_CACHE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.APPD_BAZEL_CACHE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          python3 bare/scripts/build-sdk.py \
            --target "${{ matrix.target }}" \
            --output "target/bare/sdk/${{ matrix.target }}"
          sccache --show-stats

      - name: Test appd CONNECT mTLS
        if: matrix.target == 'macos-arm64'
        env:
          APPD_BARE_TLS_ARTIFACT: target/bare/sdk/macos-arm64/bare-tls.bare
          APPD_REQUIRE_NATIVE_TLS_TEST: "1"
        run: |
          pnpm build:runtime
          python3 -m unittest -v bare.tests.test_mtls.BareTlsIntegrationTests.test_mtls_handshakes

      - name: Archive SDK
        run: |
          set -euo pipefail
          tar -czf "appd-bare-sdk-${{ matrix.target }}.tar.gz" \
            -C "target/bare/sdk/${{ matrix.target }}" .

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: appd-bare-sdk-${{ matrix.target }}
          path: appd-bare-sdk-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: create release
    if: github.event_name == 'schedule' || inputs.platform == 'all'
    needs: build-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Download SDK artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: appd-bare-sdk-*
          path: artifacts
          merge-multiple: true

      - name: Compute release metadata
        id: meta
        run: |
          set -euo pipefail
          tag="$(python3 -c 'import tomllib; print(tomllib.load(open("bare/upstream.toml", "rb"))["upstream"]["tag"])')"
          commit="$(python3 -c 'import tomllib; print(tomllib.load(open("bare/upstream.toml", "rb"))["upstream"]["commit"])')"
          {
            echo "tag=appd.bare-${tag}.${{ github.run_number }}"
            echo "upstream_tag=${tag}"
            echo "upstream_commit=${commit}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          gh release delete "${tag}" --yes --cleanup-tag || true
          gh release create "${tag}" artifacts/*.tar.gz \
            --title "${tag}" \
            --notes "Built from holepunchto/bare-kit ${{ steps.meta.outputs.upstream_tag }} (${{ steps.meta.outputs.upstream_commit }})."
