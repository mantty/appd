name: appd native SDK weekly

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options:
          - all
          - macos-arm64
          - macos-x64
          - ios-arm64
          - ios-simulator-arm64
          - ios-simulator-x64
          - android-arm64
          - windows-x64
        default: all
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: appd-bare-weekly-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "22"
  SCCACHE_VERSION: "0.15.0"
  SCCACHE_BUCKET: appd-workerd-bazel-cache
  SCCACHE_ENDPOINT: https://dacf3ead71e534fdef9555c28d81774c.r2.cloudflarestorage.com
  SCCACHE_REGION: auto
  SCCACHE_S3_KEY_PREFIX: bare/sccache/v1
  SCCACHE_S3_USE_SSL: "true"
  SCCACHE: sccache

jobs:
  build-sdk:
    name: build ${{ matrix.target }}
    if: github.event_name == 'schedule' || inputs.platform != 'windows-x64'
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON((github.event_name == 'schedule' || inputs.platform == 'all') && '["macos-arm64", "macos-x64", "ios-arm64", "ios-simulator-arm64", "ios-simulator-x64", "android-arm64"]' || format('["{0}"]', inputs.platform)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Android SDK
        if: matrix.target == 'android-arm64'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android NDK
        if: matrix.target == 'android-arm64'
        run: sdkmanager "ndk;29.0.14206865"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,x86_64-apple-darwin,aarch64-linux-android

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.9.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache upstream BareKit sources
        uses: actions/cache@v5.0.5
        with:
          path: target/bare/build/${{ matrix.target }}/_deps
          key: appd-bare-sources-${{ matrix.target }}-${{ hashFiles('bare/CMakeLists.txt', 'bare/vendor/bare-tls/**', 'pnpm-lock.yaml') }}

      - name: Install sccache
        run: |
          set -euo pipefail
          machine="$(uname -m)"
          case "${machine}" in
            arm64) triple="aarch64-apple-darwin" ;;
            x86_64) triple="x86_64-apple-darwin" ;;
            *) echo "unsupported runner architecture: ${machine}" >&2; exit 1 ;;
          esac
          archive="sccache-v${SCCACHE_VERSION}-${triple}.tar.gz"
          curl -fsSLO "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/${archive}"
          curl -fsSLO "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/${archive}.sha256"
          expected="$(cat "${archive}.sha256")"
          actual="$(shasum -a 256 "${archive}" | cut -d ' ' -f 1)"
          test "${actual}" = "${expected}"
          tar -xzf "${archive}"
          echo "${PWD}/sccache-v${SCCACHE_VERSION}-${triple}" >> "${GITHUB_PATH}"

      - name: Build SDK
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.APPD_BAZEL_CACHE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.APPD_BAZEL_CACHE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          cargo run -p appd-cli -- pack build --target "${{ matrix.target }}"
          sccache --show-stats

      - name: Verify packaged Worker mTLS
        if: matrix.target == 'macos-arm64'
        run: cargo test -p appd-runtime --features native --test packaged_worker

      - name: Archive SDK
        run: |
          set -euo pipefail
          tar -czf "appd-bare-sdk-${{ matrix.target }}.tar.gz" \
            -C "target/bare/sdk/${{ matrix.target }}" .

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: appd-bare-sdk-${{ matrix.target }}
          path: appd-bare-sdk-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-windows-sdk:
    name: build windows-x64
    if: github.event_name == 'schedule' || inputs.platform == 'all' || inputs.platform == 'windows-x64'
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Check native build tools
        run: |
          cmake --version
          nasm -v
          perl --version

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 9.9.0

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache upstream BareKit sources
        uses: actions/cache@v5.0.5
        with:
          path: target/bare/build/windows-x64/_deps
          key: appd-bare-sources-windows-x64-${{ hashFiles('bare/CMakeLists.txt', 'bare/vendor/bare-tls/**', 'pnpm-lock.yaml') }}

      - name: Install sccache
        run: |
          $archive = "sccache-v$env:SCCACHE_VERSION-x86_64-pc-windows-msvc.zip"
          $base = "https://github.com/mozilla/sccache/releases/download/v$env:SCCACHE_VERSION"
          Invoke-WebRequest "$base/$archive" -OutFile $archive
          Invoke-WebRequest "$base/$archive.sha256" -OutFile "$archive.sha256"
          $expected = (Get-Content "$archive.sha256").Trim().Split(' ')[0]
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "sccache checksum mismatch" }
          Expand-Archive $archive -DestinationPath .
          Add-Content $env:GITHUB_PATH "$pwd\sccache-v$env:SCCACHE_VERSION-x86_64-pc-windows-msvc"

      - name: Build SDK
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.APPD_BAZEL_CACHE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.APPD_BAZEL_CACHE_SECRET_ACCESS_KEY }}
        run: |
          cargo run -p appd-cli -- pack build --target windows-x64
          sccache --show-stats

      - name: Archive SDK
        run: tar -czf appd-bare-sdk-windows-x64.tar.gz -C target/bare/sdk/windows-x64 .

      - name: Upload SDK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: appd-bare-sdk-windows-x64
          path: appd-bare-sdk-windows-x64.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: create release
    if: github.event_name == 'schedule' || inputs.platform == 'all'
    needs: [build-sdk, build-windows-sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Download SDK artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: appd-bare-sdk-*
          path: artifacts
          merge-multiple: true

      - name: Compute release metadata
        id: meta
        run: |
          set -euo pipefail
          tag="$(sed -n 's/^set(APPD_BARE_KIT_TAG "\(.*\)")$/\1/p' bare/CMakeLists.txt)"
          commit="$(sed -n 's/^set(APPD_BARE_KIT_COMMIT "\(.*\)")$/\1/p' bare/CMakeLists.txt)"
          {
            echo "tag=appd.bare-${tag}.${{ github.run_number }}"
            echo "upstream_tag=${tag}"
            echo "upstream_commit=${commit}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          gh release delete "${tag}" --yes --cleanup-tag || true
          gh release create "${tag}" artifacts/*.tar.gz \
            --title "${tag}" \
            --notes "Source-built appd BareKit with statically linked appd native modules, pinned to holepunchto/bare-kit ${{ steps.meta.outputs.upstream_tag }} (${{ steps.meta.outputs.upstream_commit }})."
